# i3blocks config file
#
# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks
#
# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
command=/usr/lib/i3blocks/$BLOCK_NAME
separator_block_width=7
markup=none

# PS3 controller battery
[ds3_battery]
command=~/.i3blocks/ds3_battery
separator=true
interval=300

#[craigslist_bikeparts]
#command=~/.i3blocks/CLsharkbar.py 'https://sfbay.craigslist.org/search/bip?sort=date'
#instance=~/.i3blocks/bikeparts
#separator=true
#interval=450
#label=PARTS

# Network interface monitoring
[ethernet]
command=~/.i3blocks/network
instance=enp*
interval=10
separator=true
label=E:

[wifi]
command=~/.i3blocks/network
instance=wlan*
interval=10
separator=true
label=W:

# Memory usage
#
# The type defaults to "mem" if the instance is not specified.
[memory]
command=~/.i3blocks/memory
instance=mem
separator=true
interval=30

# GPU Monitoring
# NOTE: the interval must be greater than the time it takes for the gpu to
# suspend after running `nvidia-smi`
[gpu]
command=~/.i3blocks/gpu
interval=40

# CPU Monitoring
#
# The script may be called with -w and -c switches to specify thresholds,
# see the script for details.
[cpu_usage]
command=~/.i3blocks/cpu_usage
interval=9
separator=false

[cpu_freq]
command=~/.i3blocks/cpu_freq
interval=9  # offset to measure on off-intervals
separator=false

[cpu_power]
command=~/.i3blocks/cpu_power 9
interval=9
separator=false

[temperature]
command=~/.i3blocks/temperature --chip thinkpad-isa-0000
interval=9

# Color Temperature
[color_temperature]
command=~/.i3blocks/color_temp
interval=once
signal=35

# Volume indicator
#
# The first parameter sets the step (and units to display)
# The second parameter overrides the mixer selection
# See the script for details.
[volume]
command=~/.i3blocks/volume
instance=Master
interval=once
signal=10

# Battery indicator
#
# The battery instance defaults to 0.
[battery]
command=~/.i3blocks/bat_level
instance=0
interval=10
separator=false

# Battery Power usage
[bat_power]
command=~/.i3blocks/bat_power
separator=true
interval=10

# Date Time
#
[time]
command=date '+%a, %b %d %I:%M:%S %p'
interval=1
