# i3blocks config file
#
# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks
#
# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
separator_block_width=7
markup=none
format=json

# PS3 controller battery
[ds3_battery]
command=~/.i3blocks/ds3_battery.sh
separator=true
interval=300

#[craigslist_bikeparts]
#command=~/.i3blocks/CLsharkbar.py 'https://sfbay.craigslist.org/search/bip?sort=date'
#instance=~/.i3blocks/bikeparts
#separator=true
#interval=450
#label=PARTS

# Network interface monitoring
[ethernet]
command=~/.i3blocks/network.sh
instance=enp*
interval=60
separator=true
label=E:

[wifi]
command=~/.i3blocks/network.sh
instance=wlan*
interval=60
separator=true
label=W:

# Memory usage
#
# The type defaults to "mem" if the instance is not specified.
[memory]
command=~/.i3blocks/memory.sh
instance=mem
separator=true
interval=60

# GPU Monitoring
# NOTE: the interval must be greater than the time it takes for the gpu to
# suspend after running `nvidia-smi`
[gpu]
command=~/.i3blocks/gpu.sh
interval=60

# CPU Monitoring
#
# The script may be called with -w and -c switches to specify thresholds,
# see the script for details.
[cpu_power]
command=~/.i3blocks/cpu_power.sh 12
interval=12
separator=false

[cpu_temp]
command=~/.i3blocks/cpu_temp.sh thinkpad-isa-0000
interval=12
separator=false

[cpu_freq]
command=~/.i3blocks/cpu_freq.sh
interval=12

# Display Color Temperature
[color_temperature]
command=~/.i3blocks/color_temp.sh
interval=once
signal=30

# Volume indicator
#
# The first parameter sets the step (and units to display)
# The second parameter overrides the mixer selection
# See the script for details.
[volume]
command=~/.i3blocks/volume.sh
instance=Master
interval=once
signal=10

# Battery indicator
#
# The battery instance defaults to 0.
[battery]
command=~/.i3blocks/bat_level.sh
instance=0
interval=60
separator=false

# Battery Power usage
[bat_power]
command=~/.i3blocks/bat_power.sh
separator=true
interval=60

# Date Time
[time]
command=date '+%a, %b %d %I:%M:%S %p'
interval=1
format=
