# DO NOT SYMLINK
#
# Having the vm.max_map_count set to a low value can affect the stability and
# performance of some games. It can therefore be desirable to increase the size
# permanently.
#
# A value of 2147483642 (MAX_INT - 5) is the default in SteamOS.
#
# https://wiki.archlinux.org/title/Gaming#Increase_vm.max_map_count
vm.max_map_count = 2147483642
